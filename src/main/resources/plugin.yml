name: Scanner
description: A Minecraft plugin that adds a command for scanning the terrain with rakecasts.
version: '1.1.0'

main: net.dvmn2.scanner.Scanner
api-version: '1.21.11'
load: POSTWORLD

authors: [ DVMN2 ]

commands:
  scan:
    description: Сканирует блок под сканером и создаёт item-display
    usage: /scan <энтити-сканер> <энтити-дисплей> [макс.радиус] [сжатие] [задержка-тиков]

permissions:
  scan.admin:
    description: Доступ к сканированию
    default: op